name: Release Train

on:
  pull_request:
    types: [closed]
    branches: [main]

env:
  WEB_APP_PATH: apps/web
  API_APP_PATH: apps/api
  PNPM_SUPPRESS_UPDATE_NOTIFIER: true

jobs:
  version-bump:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    permissions:
      contents: write
    outputs:
      new-web-version: ${{ steps.bump_versions.outputs.NEW_WEB_VERSION }}
      new-api-version: ${{ steps.bump_versions.outputs.NEW_API_VERSION }}
      version-type: ${{ steps.analyze-commits.outputs.version_type }}
      web-changed: ${{ steps.bump_versions.outputs.WEB_CHANGED }}
      api-changed: ${{ steps.bump_versions.outputs.API_CHANGED }}

    steps:
      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Analyze commit messages and determine version bump
        id: analyze-commits
        run: |
          COMMITS=$(git log --oneline ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }})
          echo "Analyzing commits:"
          echo "$COMMITS"
          VERSION_TYPE="patch"
          if echo "$COMMITS" | grep -E ":boom:" > /dev/null; then
            VERSION_TYPE="major"
          elif echo "$COMMITS" | grep -E ":sparkles:|:tada:" > /dev/null; then
            VERSION_TYPE="minor"
          fi
          echo "version_type=$VERSION_TYPE" >> $GITHUB_OUTPUT

      - name: Get changed files
        id: changed-files
        run: |
          CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }})
          echo "$CHANGED_FILES" > changed_files.txt

      - name: Check for changes and bump versions
        id: bump_versions
        run: |
          VERSION_TYPE="${{ steps.analyze-commits.outputs.version_type }}"
          CHANGED_FILES=$(cat changed_files.txt)

          # Exit early if no app directory changes (Requirement 1.3: no version bump for non-app changes)
          echo "--- Debug: Changed Files ---"
          echo "${CHANGED_FILES}"
          echo "----------------------------"
          if echo "${CHANGED_FILES}" | grep -qE "^(${WEB_APP_PATH}/|${API_APP_PATH}/)"; then
            echo "App directory changes detected. Proceeding with version check."
          else
            echo "No changes in app directories. Skipping version bump (will still deploy)."
            {
              echo "WEB_CHANGED=false";
              echo "API_CHANGED=false";
              echo "NEW_WEB_VERSION=";
              echo "NEW_API_VERSION=";
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          bump_version() {
            local app_path=$1
            local version_type=$3
            if [ -f "$app_path/package.json" ]; then
              cd "$app_path"
              pnpm version "$version_type" --no-git-tag-version >/dev/null
              local new_version=$(node -p "require('./package.json').version")
              cd - > /dev/null
              echo "$new_version"
            fi
          }

          # Check if specific app directory has changes
          has_changes() {
            local path=$1
            echo "$CHANGED_FILES" | grep -E "^$path/" > /dev/null
          }

          WEB_CHANGED=false
          API_CHANGED=false
          NEW_WEB_VERSION=""
          NEW_API_VERSION=""

          # Only bump versions when app directories have changes (Requirements 1.1, 1.2)
          if has_changes "$WEB_APP_PATH"; then
            NEW_WEB_VERSION=$(bump_version "$WEB_APP_PATH" "web" "$VERSION_TYPE")
            WEB_CHANGED=true
          fi

          if has_changes "$API_APP_PATH"; then
            NEW_API_VERSION=$(bump_version "$API_APP_PATH" "api" "$VERSION_TYPE")
            API_CHANGED=true
          fi

          rm changed_files.txt

          {
            echo "WEB_CHANGED=$WEB_CHANGED";
            echo "API_CHANGED=$API_CHANGED";
            echo "NEW_WEB_VERSION=$NEW_WEB_VERSION";
            echo "NEW_API_VERSION=$NEW_API_VERSION";
          } >> "$GITHUB_OUTPUT"

      - name: Commit and Push Version Bump
        run: |
          # Only add specific package.json files that were actually modified
          FILES_TO_COMMIT=()
          if [ "${{ steps.bump_versions.outputs.WEB_CHANGED }}" = "true" ]; then
            FILES_TO_COMMIT+=("$WEB_APP_PATH/package.json")
          fi
          if [ "${{ steps.bump_versions.outputs.API_CHANGED }}" = "true" ]; then
            FILES_TO_COMMIT+=("$API_APP_PATH/package.json")
          fi
          
          if [ ${#FILES_TO_COMMIT[@]} -gt 0 ]; then
            git add "${FILES_TO_COMMIT[@]}"
            if ! git diff --staged --quiet; then
              CHANGES=()
              if [ "${{ steps.bump_versions.outputs.WEB_CHANGED }}" = "true" ]; then
                CHANGES+=("web@${{ steps.bump_versions.outputs.NEW_WEB_VERSION }}")
              fi
              if [ "${{ steps.bump_versions.outputs.API_CHANGED }}" = "true" ]; then
                CHANGES+=("api@${{ steps.bump_versions.outputs.NEW_API_VERSION }}")
              fi
              COMMIT_MSG="🔖 bump versions (${CHANGES[*]})"
              git commit --no-verify -m "$COMMIT_MSG"
              git push --no-verify
            else
              echo "No version changes to commit."
            fi
          else
            echo "No packages were changed, skipping commit."
          fi

  create-release-pr:
    runs-on: ubuntu-latest
    needs: version-bump
    if: success()
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          # Check if any versions were bumped
          if [ "${{ needs.version-bump.outputs.web-changed }}" = "true" ] || [ "${{ needs.version-bump.outputs.api-changed }}" = "true" ]; then
            # Create title with version information
            TITLE="🚀 Release"
            if [ "${{ needs.version-bump.outputs.web-changed }}" = "true" ]; then
              TITLE="$TITLE web@${{ needs.version-bump.outputs.new-web-version }}"
            fi
            if [ "${{ needs.version-bump.outputs.api-changed }}" = "true" ]; then
              TITLE="$TITLE api@${{ needs.version-bump.outputs.new-api-version }}"
            fi
          else
            # Generic title when no versions are bumped
            TITLE="🚀 Deploy changes"
          fi

          gh pr create \
            --base prod \
            --head main \
            --title "$TITLE" \
            --body "Automated release PR. This PR will be automatically merged."
